name: Desktop apps (Windows · macOS · Linux)

# 새 버전 내는 법: tauri.conf.json·package.json 의 version 을 올려 push 한 뒤
#   gh release create v1.2.3 --title "나날노트 v1.2.3" --notes "…"
# 처럼 릴리스를 "게시"하면 세 운영체제용 설치 파일·포터블 파일을 만들어 그 릴리스에 올린다.
# (GITHUB_TOKEN 은 릴리스를 새로 만들 수 없어서, 릴리스는 사람이 만들고 빌드는 올리기만 한다)
# Actions 화면에서 이미 있는 릴리스 태그를 넣어 다시 돌릴 수도 있다.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '파일을 올릴 릴리스 태그 (예: v1.0.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Linux 빌드 도구
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: 릴리스 번호 찾기
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "id=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG --jq .id)" >> "$GITHUB_OUTPUT"

      - name: 설치 파일 만들기 + 릴리스에 올리기
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.rel.outputs.id }}
          # GitHub 은 파일 이름의 한글을 지워 버리므로 영문 이름으로 올린다
          releaseAssetNamePattern: '[mainBinaryName]_[version]_[platform]_[arch][setup][ext]'
          args: ${{ matrix.args }}

      - name: Windows 포터블 zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $dir = "portable/나날노트"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item src-tauri/target/release/nanalnote.exe "$dir/나날노트.exe"
          Set-Content -Encoding utf8 "$dir/portable.txt" "이 파일이 있으면 나날노트가 포터블 모드로 실행됩니다. 자료와 설정은 같은 폴더의 '나날노트자료'에 저장됩니다. 지우지 마세요."
          $zip = "nanalnote-windows-portable-$v.zip"
          Compress-Archive -Path "portable/나날노트" -DestinationPath $zip -Force
          gh release upload "$env:TAG" "$zip" --clobber

      - name: macOS 포터블 zip
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          mkdir -p "portable/나날노트"
          cp -R "$app" "portable/나날노트/"
          printf '%s\n' "이 파일이 있으면 나날노트가 포터블 모드로 실행됩니다. 자료는 같은 폴더의 '나날노트자료'에 저장됩니다." > "portable/나날노트/portable.txt"
          (cd portable && ditto -c -k --sequesterRsrc --keepParent "나날노트" "../nanalnote-macos-portable-$v.zip")
          gh release upload "$TAG" "nanalnote-macos-portable-$v.zip" --clobber

  # 세 운영체제 빌드가 모두 끝나면, 버전 없는 고정 이름으로 한 벌 더 올린다 (웹판 "내려받기" 버튼이 쓰는 주소)
  latest-links:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 고정 이름 내려받기 파일
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/release-aliases.sh "$TAG" "$GITHUB_REPOSITORY"
